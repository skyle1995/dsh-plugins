# dsh-plugin-repo bundle patch: 注册主插件服务行（基础能力合集）。
#
# 该行加载本包默认导出的 Cordis 插件（服务键 pluginRepo，即 ctx.pluginRepo），
# 并挂载两个基础能力子服务：
# - ctx.skillManager（技能能力 + 规则提示词）
# - ctx.sessionArchive（会话归档，依赖官方 workspaceRegistry）
#
# 激活由服务可用性驱动：主服务注入了 pluginManager；会话归档子服务在缺少
# workspaceRegistry 时单独保持未激活，不影响其余能力。
#
# 配置通过 profile 的 cordis.patch.yml 覆盖，例如：
#
# - id: plugin-repo
#   name: 'dsh-plugin-repo'
#   config:
#     owner: your-org
#     repo: your-plugins
#     skillsDir: /custom/skills
#
- insert:
    - id: plugin-repo
      name: 'dsh-plugin-repo'

# 覆盖 base 组合包的 hmr 行：把模块监听根指向 profile 的 node_modules
# （含 .pnpm 真实文件），使安装/更新插件后宿主模块随文件变化热重载，
# 无需重启 dsh。ignored 必须放行 **/.pnpm（隐藏目录），否则监听不到
# pnpm 实际安装的包文件。按 id 寻址覆盖，仅在存在 profileContext
# （Web 等 profile）时生效。
- id: hmr
  name: '@deepseek-ai/dsh-hmr'
  config:
    root: !!js "ctx.get('profileContext') ? [ctx.get('profileContext').dir + '/node_modules'] : []"
    ignored: ["cache", "data"]

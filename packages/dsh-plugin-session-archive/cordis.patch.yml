# dsh-plugin-session-archive bundle patch: 注册会话归档管理服务行。
#
# 该行加载本包默认导出的 Cordis 插件（服务键 sessionArchive），基于官方
# ctx.workspaceRegistry 的归档集实现会话的归档 / 还原 / 删除，并在 Web
# profile 里注册浏览器半区使用的 /api/dsh-session-archive 路由。浏览器
# 半区通过 dsh.client 声明与 ./client 导出提供设置面板里的「会话归档」
# 分区（settings.section）。
#
- insert:
    - id: session-archive
      name: 'dsh-plugin-session-archive'
